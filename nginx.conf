server {
    listen 80;
    server_name localhost;

    # Où se trouvent les fichiers compillés (le dossier dist)
    root /usr/share/nginx/html;
    index index.html index.htm;

    # Gérer la compression GZIP
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml;
    gzip_disable "MSIE [1-6]\.";

    # Cache Control pour les assets statiques
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Reverse proxy vers le backend API Express et support temps réel SSE
    location /api/ {
        proxy_pass http://puma_server:3001;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
    }

    # Configuration vitale pour les Single Page Applications (React/Vite)
    # Toutes les requêtes qui ne matchent pas un fichier mènent à index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Pages d'erreur standards
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
